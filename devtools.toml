# Shared build tooling from jmerhar/devtools, fetched into .devtools/ by bin/devtools-fetch.sh.
[fetch]
ref = "v1"
files = [
  "make/devtools.mk",
  "bin/lockfile.sh",
  "bin/check-lockfile.sh",
  "bin/version.py",
  "bin/release.sh",
  "bin/github-release.sh",
  "fetch/devtools-fetch.sh",
  "bin/devtools-check.py",
  "config/ruff.toml",
]
coverage = true

# The npm package, whose lockfile resolves only to the public registry.
[npm]
dirs = ["js"]

# The Python and npm packages share one version.
[version]
pyprojects = ["python/pyproject.toml"]
npm = ["js"]

[release]
title = "jigkit"

# .github/dependabot.yml, generated from these by `make devtools-fix`: GitHub Actions, then each
# update below, every one grouped into a single weekly pull request that takes a release once it is
# three days old.
[[dependabot.update]]
ecosystem = "pip"
directory = "/python"
group = "python"
comment = "The package's declared ranges; only a release outside one opens a pull request."

[[dependabot.update]]
ecosystem = "npm"
directory = "/js"
group = "js"
comment = "The npm package's development dependencies and its peer ranges."

# The files each coverage suite's Codecov flag covers (codecov.yml, generated by `make devtools-fix`).
[codecov]
paths = { python = ["python/src/"], js = ["js/src/"] }
