# Shared by the package, its tests, and the scripts in bin/. The rules come from jmerhar/devtools.
extend = ".devtools/config/ruff.toml"
# The template is linted as the application it renders into, with that application's rules
# (bin/check-template.sh), and most of its Python is Jinja until then.
extend-exclude = ["template"]

[lint.extend-per-file-ignores]
# The sample application's generated migrations, written in the style Alembic generates.
"python/tests/sample_app/alembic/versions/*" = ["UP035", "UP007"]

[lint.isort]
known-first-party = ["jigkit"]
