# Generated by devtools-check.py --fix from devtools.toml's [dependabot] table: edit that
# table rather than this file, which `devtools-check.py` compares with what it generates.
#
# Weekly updates, one grouped pull request per ecosystem. A release is taken once it is
# three days old, so a hijacked version has usually been pulled before an update proposes
# it; the packages released from the same hands are taken at once.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - "*"

  # The package's declared ranges; only a release outside one opens a pull request.
  - package-ecosystem: "pip"
    directory: "/python"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "jigkit"
    groups:
      python:
        patterns:
          - "*"

  # The npm package's development dependencies and its peer ranges.
  - package-ecosystem: "npm"
    directory: "/js"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
      exclude:
        - "@jmerhar/*"
    groups:
      js:
        patterns:
          - "*"
