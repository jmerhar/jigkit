name: CI

on:
  # push is limited to main because pull_request already covers branch work; triggering on both
  # would run everything twice for every pull request.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Read-only unless a job asks for more, so a compromised step cannot push to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install -e "python[dev,postgres]"

      - name: Run tests with coverage
        env:
          # The runner's own Python, rather than the virtualenv a local run uses.
          PYTHON: python
        # Through the same script as `make test`, so CI and a local run cannot drift.
        run: >-
          bin/test.sh -v --junitxml=junit/python.xml
          --cov=jigkit --cov-report=term-missing
          --cov-report=xml --cov-report=json --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-python
          path: |
            python/coverage.xml
            python/coverage.json
            python/htmlcov
            python/junit
          if-no-files-found: error

  test-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install
        working-directory: js
        run: npm ci

      - name: Type-check and test with coverage
        run: bin/test-js.sh --coverage

      - name: Check the package builds and packs
        working-directory: js
        run: npm run build && npm pack --dry-run

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-js
          path: js/coverage
          if-no-files-found: error

  template:
    # A new application rendered from the template, on this checkout's jigkit, through its own
    # make check and up to a running image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # copier describes the template's commit from the tags.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install
        run: |
          pip install copier
          npm ci --no-audit --no-fund --prefix js

      - name: Render and check an application
        run: bin/check-template.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install
        run: pip install ruff

      # The shared scripts from jmerhar/devtools, at the ref devtools.toml pins.
      - name: Fetch the shared tooling
        run: bin/devtools-fetch.sh

      - name: Lint
        env:
          PYTHON: python
        run: bin/lint.sh

  coverage:
    needs: [test, test-js]
    runs-on: ubuntu-latest
    # contents: read for checkout; statuses: write to link the coverage report from the commit.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Restored to the path coverage.toml declares.
      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-python
          path: python

      - name: Download npm package coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage-js
          path: js/coverage

      - uses: jmerhar/coverage/.github/actions/summary@v1

      # Informational (see codecov.yml), and before the gate so the data lands even when the gate
      # fails.
      - uses: jmerhar/coverage/.github/actions/codecov@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: python/junit/*.xml

      # Fails the build if the suite drops below its bound in coverage.toml.
      - uses: jmerhar/coverage/.github/actions/gate@v1

      # Only on green pushes to main; the action skips when the token is absent.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          description: HTML coverage reports for both packages
